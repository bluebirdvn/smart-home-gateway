name: Check C++ Build

on: 
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-apps:
    runs-on: ubuntu-latest

    steps:
    - name: download source code 
      uses: actions/checkout@v4
    - name: Install Qt 6.8
      uses: jurplel/install-qt-action@v4
      with: 
        version: "6.8.0"
        modules: qtcharts 
    - name: install libs
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
        sudo apt-get install -y libsqlite3-dev libdbus-1-dev libglib2.0-dev
        sudo apt-get install -y libpaho-mqtt-dev
    - name: configure cmake
      run: |
        cd apps
        cmake -B build -S .
    - name: compile
      run: |
        cd apps
        cmake --build build -j4