<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.gateway.mesh"/>
    <allow own="com.gateway.mqtt"/>
    <allow own="com.gateway.ui"/>
    <allow own="com.gateway.db"/> 

    <allow send_destination="com.gateway.mesh"/>
    <allow send_destination="com.gateway.mqtt"/>
    <allow send_destination="com.gateway.ui"/>
    <allow send_destination="com.gateway.db"/> 

    <allow receive_sender="com.gateway.mesh"/>
    <allow receive_sender="com.gateway.mqtt"/>
    <allow receive_sender="com.gateway.ui"/>
    <allow receive_sender="com.gateway.db"/> 
  </policy>

  <policy context="default">
    <allow own="com.gateway.mesh"/>
    <allow own="com.gateway.mqtt"/>
    <allow own="com.gateway.ui"/>
    <allow own="com.gateway.db"/>
    <allow send_destination="com.gateway.mesh"/>
    <allow send_destination="com.gateway.mqtt"/>
    <allow send_destination="com.gateway.ui"/>
    <allow send_destination="com.gateway.db"/>
    <allow receive_sender="com.gateway.mesh"/>
    <allow receive_sender="com.gateway.mqtt"/>
    <allow receive_sender="com.gateway.ui"/>
    <allow receive_sender="com.gateway.db"/>
  </policy>
</busconfig>
